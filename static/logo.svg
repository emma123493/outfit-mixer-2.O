<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="200" height="200" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Outfit Mixer logo</title>
  <desc id="logoDesc">Stylized monogram with a decorative script wordmark on a black rounded background.</desc>

  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FF9A3D"/>
    </linearGradient>
    <filter id="monoShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- black rounded background -->
  <rect x="6" y="6" width="148" height="148" rx="24" fill="#0b0b0b" />

  <!-- inner subtle ring -->
  <rect x="14" y="14" width="132" height="132" rx="20" fill="none" stroke="#1b1b1b" stroke-width="1.5" />

  <!-- detailed gold rose behind monogram -->
  <g transform="translate(80,60) scale(1)" opacity="0.95">
    <g transform="scale(0.9)" fill="url(#gold)" stroke="#2b1a00" stroke-width="0.6">
      <!-- outer petals -->
      <path d="M0,-34 C12,-34 28,-28 34,-18 C38,-6 32,6 22,12 C14,18 6,22 0,24 C-6,22 -14,18 -22,12 C-32,6 -38,-6 -34,-18 C-28,-28 -12,-34 0,-34 Z" />
      <!-- middle petals -->
      <path d="M0,-18 C6,-18 14,-14 18,-8 C20,0 14,6 8,8 C4,10 0,12 -4,10 C-10,8 -14,4 -16,-2 C-18,-8 -12,-18 0,-18 Z" fill-opacity="0.95"/>
      <!-- inner swirl -->
      <path d="M2,-6 C6,-4 10,-2 10,2 C10,6 6,8 2,8 C-2,8 -6,6 -8,2 C-10,-2 -6,-6 2,-6 Z" fill-opacity="0.9" />
    </g>
  </g>

  <!-- monogram background circle (foreground over rose) -->
  <circle cx="80" cy="60" r="36" fill="#0f0f0f" opacity="0.72" />

  <!-- fancy O (gold gradient) -->
  <g transform="translate(80,60)" filter="url(#monoShadow)">
    <path d="M-18,0 A18,18 0 1,0 18,0 A12,12 0 1,1 -12,0" fill="url(#gold)" stroke="#2b1a00" stroke-width="1"/>
  </g>

  <!-- fancy M (overlapping, white stroke) -->
  <g transform="translate(80,60)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-6,8 L-6,-8 L0,4 L6,-8 L6,8" />
  </g>

  <!-- decorative flourish behind letters -->
  <path d="M28,110 C48,92,112,92,132,110" stroke="#ffffff" stroke-opacity="0.04" stroke-width="3" fill="none" />

  <!-- gold vine line-pattern - left side -->
  <g transform="translate(22,22) scale(0.9)" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M6 0 C8 18, 8 34, 6 52" />
    <path d="M6 12 C2 8, 10 8, 6 12" stroke-width="1.2" />
    <path d="M6 24 C2 20, 10 20, 6 24" stroke-width="1.2" />
    <path d="M6 36 C2 32, 10 32, 6 36" stroke-width="1.2" />
    <path d="M6 48 C2 44, 10 44, 6 48" stroke-width="1.2" />
  </g>

  <!-- gold vine line-pattern - right side (mirrored) -->
  <g transform="translate(138,22) scale(-0.9,0.9)" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M6 0 C8 18, 8 34, 6 52" />
    <path d="M6 12 C2 8, 10 8, 6 12" stroke-width="1.2" />
    <path d="M6 24 C2 20, 10 20, 6 24" stroke-width="1.2" />
    <path d="M6 36 C2 32, 10 32, 6 36" stroke-width="1.2" />
    <path d="M6 48 C2 44, 10 44, 6 48" stroke-width="1.2" />
  </g>

  <!-- wordmark: Outfit Mixer in script-style (uses system fallback if font not available) -->
  <text x="80" y="140" text-anchor="middle" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="16" fill="#ffffff" opacity="0.98">Outfit Mixer</text>

</svg>
